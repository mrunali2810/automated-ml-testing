[pytest]
testpaths = tests
# One command runs everything AND produces coverage (terminal + HTML).
# --cov-fail-under makes the pipeline fail if coverage drops below 80 %.
addopts =
    -ra
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-fail-under=80
markers =
    data: data validation and preprocessing tests
    model: ML model quality tests (accuracy, invariance, directional, shape)
    api: prediction API tests
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
