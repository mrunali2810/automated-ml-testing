name: ML Automated Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model (artefact used by the model and API tests)
        run: python -m src.model

      # Stage runs use --no-cov: the 80 % coverage gate only makes sense for the full suite.
      - name: 4. Data validation tests
        run: pytest -m data --no-cov

      - name: 5. ML model tests
        run: pytest -m model --no-cov

      - name: 6. API tests
        run: pytest -m api --no-cov

      - name: 7. Full suite + coverage report (fails below 80 %)
        run: pytest   # pytest.ini adds --cov, term + HTML report and --cov-fail-under=80

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: reports/coverage/

      - name: Injected-bug demonstration (framework must catch the bug)
        run: python bug_demo/run_bug_demo.py --bug all

      - name: Upload bug-demo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-demo-logs-py${{ matrix.python-version }}
          path: reports/bug_demo/
# Any failing step above fails the job, and therefore the pipeline (step 8).
